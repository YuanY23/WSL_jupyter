<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教学平台 — 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            overflow: hidden;
        }

        /* Animated background orbs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: rgba(99, 102, 241, 0.15);
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: rgba(14, 165, 233, 0.12);
            bottom: -80px;
            right: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(30px, 20px) scale(1.05);
            }
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 48px 40px 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow:
                0 24px 64px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slide-up 0.5s ease-out;
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo / Icon */
        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
        }

        .logo-icon svg {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: white;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            color: #f1f5f9;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: rgba(148, 163, 184, 0.8);
            margin-bottom: 32px;
            letter-spacing: 0.03em;
        }

        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.25);
            color: #fcd34d;
            font-size: 12px;
        }

        /* Form inputs */
        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        .input-wrap {
            position: relative;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 15px;
            color: #f1f5f9;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: rgba(148, 163, 184, 0.4);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: rgba(99, 102, 241, 0.6);
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* Eye button */
        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 4px;
            color: rgba(148, 163, 184, 0.6);
            transition: color 0.2s;
        }

        .eye-btn:hover {
            color: #94a3b8;
        }

        input[type="password"] {
            padding-right: 44px;
        }

        /* Submit button */
        .btn-submit {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #6366f1, #38bdf8);
            color: white;
            letter-spacing: 0.05em;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
            font-family: inherit;
        }

        .btn-submit:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.45);
        }

        .btn-submit:active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Footer link */
        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: rgba(148, 163, 184, 0.7);
        }

        .footer-link a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer-link a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <!-- Icon -->
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5z" />
                    <path d="M2 17l10 5 10-5" />
                    <path d="M2 12l10 5 10-5" />
                </svg>
            </div>
        </div>

        <h1>教学平台</h1>
        <p class="subtitle">Jupyter 教学管理系统</p>

        <!-- HTTP warning (only shown on http://) -->
        <div id="http-warn" class="alert alert-warning" style="display:none;">
            ⚠ 当前连接未加密，建议启用 HTTPS
        </div>

        <!-- Login error -->
        {% if login_error %}
        <div class="alert alert-error">{{ login_error }}</div>
        {% endif %}

        <form action="{{ login_url }}?next={{ next }}" method="post">
            <input type="hidden" name="_xsrf" value="{{ xsrf }}" />

            <div class="field">
                <label for="username_input">用户名</label>
                <input id="username_input" type="text" name="username" value="{{ username }}" autocomplete="username"
                    autocapitalize="off" autocorrect="off" autofocus required placeholder="请输入用户名" />
            </div>

            <div class="field">
                <label for="password_input">密码</label>
                <div class="input-wrap">
                    <input id="password_input" type="password" name="password" autocomplete="current-password"
                        autocapitalize="off" autocorrect="off" required placeholder="请输入密码" />
                    <button id="eye" type="button" class="eye-btn" aria-label="显示/隐藏密码">👁</button>
                </div>
            </div>

            {% if two_factor_auth %}
            <div class="field">
                <label for="2fa_input">验证码 (2FA)</label>
                <input id="2fa_input" type="text" name="2fa" autocapitalize="off" autocorrect="off"
                    placeholder="如未开启 2FA 请留空" />
            </div>
            {% endif %}

            <button type="submit" id="login_submit" class="btn-submit">登 录</button>
        </form>

        {% if enable_signup %}
        <div class="footer-link">
            还没有账号？<a href="{{ base_url }}signup">立即注册</a>
        </div>
        {% endif %}

    </div>

    <script>
        // Show HTTP warning if not HTTPS
        if (window.location.protocol === 'http:') {
            document.getElementById('http-warn').style.display = 'block';
        }
        // Toggle password visibility
        document.getElementById('eye').addEventListener('click', function () {
            const pwd = document.getElementById('password_input');
            const isHidden = pwd.type === 'password';
            pwd.type = isHidden ? 'text' : 'password';
            this.textContent = isHidden ? '🔑' : '👁';
        });
    </script>

</body>

</html>
