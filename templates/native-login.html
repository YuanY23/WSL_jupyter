<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>原理仿真系统 - 登录</title>
    <link rel="icon" type="image/svg+xml" href="{{ simlab_favicon_href }}" />
    <style>
        :root {
            --bg: #ffffff;
            --panel: #ffffff;
            --line: #000000;
            --text: #000000;
            --muted: #666666;
            --accent: #000000;
            --danger: #d00000;
            --warn: #e67300;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
        }

        .login-panel {
            width: min(100%, 420px);
            padding: 40px;
            border: 2px solid var(--line);
            background: var(--panel);
            box-shadow: 4px 4px 0 var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 2px solid var(--line);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
        }

        .alert {
            padding: 16px;
            margin-bottom: 24px;
            border: 2px solid var(--line);
            font-size: 14px;
            line-height: 1.5;
            font-weight: 500;
        }

        .alert-error {
            color: var(--danger);
            border-color: var(--danger);
            background: #fffafa;
        }

        .alert-warning {
            color: var(--warn);
            border-color: var(--warn);
            background: #fffaf0;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrap {
            position: relative;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 2px solid var(--line);
            border-radius: 0;
            outline: none;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            transition: all 0.1s ease;
        }

        input[type="password"] {
            padding-right: 76px;
        }

        input::placeholder {
            color: var(--muted);
        }

        input:focus {
            box-shadow: 4px 4px 0 var(--line);
        }

        .eye-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            height: 32px;
            min-width: 60px;
            border: 2px solid var(--line);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.05em;
        }
        
        .eye-btn:hover {
            background: var(--text);
            color: var(--bg);
        }

        .btn-submit {
            width: 100%;
            height: 52px;
            margin-top: 12px;
            border: 2px solid var(--line);
            background: var(--text);
            color: var(--bg);
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.1s ease;
        }

        .btn-submit:hover {
            background: var(--bg);
            color: var(--text);
        }
        
        .btn-submit:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .footer-link {
            margin-top: 24px;
            color: var(--muted);
            text-align: center;
            font-size: 14px;
        }

        .footer-link a {
            color: var(--text);
            text-decoration: underline;
            font-weight: 600;
        }
        
        .footer-link a:hover {
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-panel {
                box-shadow: none;
                border-width: 1px;
            }
        }
    </style>
</head>

<body>
    <main class="login-panel">
        <header class="brand">
            <h1>原理仿真系统</h1>
            <span class="status-dot" aria-hidden="true"></span>
        </header>

        <div id="http-warn" class="alert alert-warning" style="display:none;">
            当前连接未加密。
        </div>

        {% if login_error %}
        <div class="alert alert-error">{{ login_error }}</div>
        {% endif %}

        <form action="{{ login_url }}?next={{ next }}" method="post">
            <input type="hidden" name="_xsrf" value="{{ xsrf }}" />

            <div class="field">
                <label for="username_input">用户名</label>
                <input id="username_input" type="text" name="username" value="{{ username }}" autocomplete="username"
                    autocapitalize="off" autocorrect="off" autofocus required placeholder="请输入用户名" />
            </div>

            <div class="field">
                <label for="password_input">密码</label>
                <div class="input-wrap">
                    <input id="password_input" type="password" name="password" autocomplete="current-password"
                        autocapitalize="off" autocorrect="off" required placeholder="请输入密码" />
                    <button id="eye" type="button" class="eye-btn" aria-label="显示或隐藏密码">SHOW</button>
                </div>
            </div>

            {% if two_factor_auth %}
            <div class="field">
                <label for="2fa_input">验证码</label>
                <input id="2fa_input" type="text" name="2fa" autocapitalize="off" autocorrect="off"
                    placeholder="请输入验证码" />
            </div>
            {% endif %}

            <button type="submit" id="login_submit" class="btn-submit">登录</button>
        </form>

        {% if enable_signup %}
        <div class="footer-link">
            没有账号？<a href="{{ base_url }}signup">注册</a>
        </div>
        {% endif %}
    </main>

    <script>
        if (window.location.protocol === 'http:') {
            document.getElementById('http-warn').style.display = 'block';
        }

        document.getElementById('eye').addEventListener('click', function () {
            var pwd = document.getElementById('password_input');
            var isHidden = pwd.type === 'password';
            pwd.type = isHidden ? 'text' : 'password';
            this.textContent = isHidden ? 'HIDE' : 'SHOW';
        });
    </script>
</body>

</html>
