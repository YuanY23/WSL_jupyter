<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>simhub</title>
    <link rel="icon" type="image/svg+xml" href="{{ simlab_favicon_href }}" />
    <style>
        :root {
            --bg: #ffffff;
            --panel: #ffffff;
            --line: #000000;
            --text: #000000;
            --muted: #666666;
            --accent: #000000;
            --danger: #d00000;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
        }

        .panel {
            width: min(100%, 420px);
            padding: 40px;
            border: 2px solid var(--line);
            background: var(--panel);
            text-align: center;
            box-shadow: 4px 4px 0 var(--line);
        }

        .loader {
            width: 48px;
            height: 48px;
            margin: 0 auto 24px;
            border: 4px solid var(--bg);
            border-top-color: var(--accent);
            border-left-color: var(--accent);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .sub {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.5;
            font-weight: 500;
        }

        .failed {
            color: var(--danger) !important;
            font-weight: 600;
        }
        
        @media (max-width: 480px) {
            .panel {
                box-shadow: none;
                border-width: 1px;
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>
    <main class="panel" aria-live="polite">
        <div class="loader" aria-hidden="true"></div>
        <h1>正在启动服务器</h1>
        <p class="sub" id="status-text">请稍候…</p>
        <span id="container-state" hidden>pending</span>
    </main>

    <script>
        var progressUrl = "{{ progress_url }}";
        var redirectUrl = "{{ url }}";
        var statusEl = document.getElementById('status-text');
        var containerState = document.getElementById('container-state');

        if (progressUrl && progressUrl !== 'None') {
            var evtSource = new EventSource(progressUrl);

            evtSource.onmessage = function (e) {
                try {
                    var data = JSON.parse(e.data);
                    if (data.ready) {
                        evtSource.close();
                        statusEl.textContent = '即将进入系统…';
                        containerState.textContent = 'ready';
                        window.location.href = redirectUrl;
                    } else if (data.failed) {
                        evtSource.close();
                        statusEl.textContent = '启动失败，请联系管理员。';
                        statusEl.className = 'sub failed';
                        containerState.textContent = 'failed';
                    } else {
                        containerState.textContent = 'starting';
                    }
                } catch (err) { }
            };

            evtSource.onerror = function () {
                containerState.textContent = 'checking';
                setTimeout(function () {
                    window.location.href = redirectUrl;
                }, 5000);
            };
        } else {
            function poll() {
                fetch(redirectUrl, { method: 'HEAD' })
                    .then(function (r) {
                        if (r.ok || r.redirected) {
                            window.location.href = redirectUrl;
                        } else {
                            setTimeout(poll, 2000);
                        }
                    })
                    .catch(function () {
                        setTimeout(poll, 2000);
                    });
            }
            setTimeout(poll, 3000);
        }
    </script>
</body>

</html>
