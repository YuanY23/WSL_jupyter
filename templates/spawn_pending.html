<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在登录 — 教学平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f1f5f9;
            overflow: hidden;
        }

        /* Animated bg orbs (same as login page) */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: rgba(99, 102, 241, 0.15);
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: rgba(14, 165, 233, 0.12);
            bottom: -80px;
            right: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(30px, 20px) scale(1.05);
            }
        }

        .center {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fade-in 0.6s ease-out;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Spinner ring */
        .spinner {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: #6366f1;
            border-right-color: #38bdf8;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message {
            font-size: 22px;
            font-weight: 500;
            color: #e2e8f0;
            letter-spacing: 0.06em;
        }

        .sub {
            font-size: 13px;
            color: rgba(148, 163, 184, 0.6);
            letter-spacing: 0.03em;
        }

        /* Animated dots */
        .dots span {
            animation: blink 1.2s infinite;
            opacity: 0;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="center">
        <div class="spinner"></div>
        <div class="message">
            正在登录<span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
        <div class="sub" id="status-text">正在启动您的专属服务器</div>
    </div>

    <script>
        // Listen to JupyterHub's SSE progress endpoint and redirect when ready
        var progressUrl = "{{ progress_url }}";
        var redirectUrl = "{{ url }}";
        var statusEl = document.getElementById('status-text');

        if (progressUrl && progressUrl !== 'None') {
            var evtSource = new EventSource(progressUrl);

            evtSource.onmessage = function (e) {
                try {
                    var data = JSON.parse(e.data);
                    if (data.ready) {
                        evtSource.close();
                        statusEl.textContent = '即将跳转...';
                        window.location.href = redirectUrl;
                    } else if (data.failed) {
                        evtSource.close();
                        statusEl.textContent = '启动失败，请联系管理员';
                    }
                } catch (err) { }
            };

            evtSource.onerror = function () {
                // On error, try to redirect anyway — server might be up
                setTimeout(function () {
                    window.location.href = redirectUrl;
                }, 5000);
            };
        } else {
            // Fallback: poll until the server responds
            function poll() {
                fetch(redirectUrl, { method: 'HEAD' })
                    .then(function (r) {
                        if (r.ok || r.redirected) {
                            window.location.href = redirectUrl;
                        } else {
                            setTimeout(poll, 2000);
                        }
                    })
                    .catch(function () { setTimeout(poll, 2000); });
            }
            setTimeout(poll, 3000);
        }
    </script>

</body>

</html>
