<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background rounded card -->
  <rect width="100" height="100" rx="24" fill="#111118" />
  
  <!-- Abstract S-shaped Interlocking Curves (Solid Colors for SPA route stability) -->
  <g>
    <!-- Left cool loop (Violet) -->
    <path d="M 50,15 
             C 32,15 22,27 22,42 
             C 22,58 35,63 50,68 
             C 65,73 78,78 78,92 
             C 78,96 75,100 70,100 
             L 50,100 
             C 62,90 70,82 70,72 
             C 70,60 58,55 45,50 
             C 30,45 28,38 28,30 
             C 28,22 36,15 50,15 Z" 
          fill="#8A2387" />
    
    <!-- Right warm loop (Orange) -->
    <path d="M 50,85 
             C 68,85 78,73 78,58 
             C 78,42 65,37 50,32 
             C 35,27 22,22 22,8 
             C 22,4 25,0 30,0 
             L 50,0 
             C 38,10 30,18 30,28 
             C 30,40 42,45 55,50 
             C 70,55 72,62 72,70 
             C 72,78 64,85 50,85 Z" 
          fill="#F27121" opacity="0.85" />
  </g>
  
  <!-- Lab Grid Accents representing Calculation mesh -->
  <circle cx="50" cy="50" r="3" fill="#FFFFFF" opacity="0.9" />
  <circle cx="35" cy="30" r="2" fill="#FFFFFF" opacity="0.5" />
  <circle cx="65" cy="70" r="2" fill="#FFFFFF" opacity="0.5" />
</svg>
